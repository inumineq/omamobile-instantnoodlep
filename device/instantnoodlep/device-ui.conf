# Install as /usr/share/omamobile/device-ui.conf by the instantnoodlep device package.
# Values are physical output pixels; SafeInsets converts them to logical units.
# [I] Provisional symmetric side inset only: the ~144 touch-x minimum is
# anecdotal and has not been compared with panel active area or calibrated.
safe_insets_px=144,0,144,0
# [I] Provisional 96 px gesture strip (32 logical px at scale 3); calibrate.
gesture_edge_width_px=96
