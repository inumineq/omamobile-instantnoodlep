# Keep GNSS opt-in. The owner may set modem-gps enable=true after the
# standalone ModemManager test passes and assisted sources are audited.

[modem-gps]
enable=false

[3G]
enable=false

[cdma]
enable=false

[wifi]
enable=false

[network-nmea]
enable=false

[static-source]
enable=false

[ip]
enable=false
