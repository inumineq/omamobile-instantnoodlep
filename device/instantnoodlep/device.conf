# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 8 Pro (instantnoodlep), EU model IN2023.
#
# FORMAT: KEY=value or KEY="value" lines, comments and blank lines only.
# No shell: no $, backticks or command substitution. Mirrors the upstream
# cheetah descriptor (derekross/omarchy-mobile device/cheetah/device.conf),
# keys documented in upstream docs/RELEASES.md.
#
# Candidate descriptor for the local port. Values still marked [I] are not
# release-qualified; this package does not make them safe to use for flashing.
#
# Issue #8 convention: every field has its evidence mark on the comment line
# directly above it, "# [V] <source>" once the value is checked, or
# "# [I] <what would resolve it>" while it stays TODO. Marks never trail a
# value: upstream bin/omamobile load_device (upstream bin/omamobile:113-125)
# accepts whole-line comments only. tests/instantnoodlep-device-conf checks it.

# --- Identity ---
# [V] must equal the directory name (upstream bin/omamobile load_device)
CODENAME=instantnoodlep
# [V] ro.product.device=OnePlus8Pro, ro.product.model=IN2023 (issue #3, stage-0 A3 getprop)
NAME="OnePlus 8 Pro"
# USB_PRODUCT is unset: upstream defaults the USB gadget string to NAME
# (upstream docs/RELEASES.md §3.1); the old draft value is dropped per
# docs/drafts/device-conf-proposal.md change 7
# [V] socinfo: SM8250, soc_id 356, revision 2.1 (NOTES.md 2026-11-16, stage-0 A6)
SOC=sm8250
# Corrects the old qcom,sm8250-oneplus-instantnoodlep. Watch out: under the
# stock dtbo the live root compatible is rewritten to qcom,kona-mtp qcom,kona
# qcom,mtp (NOTES.md 2026-11-17 night); see KONA-ROOT-DESIGN.md
# [V] first root compatible of the ported DTS (BRINGUP-M1-PLAN.md:165-167; docs/research/sm8250-dts-gap.md review item 1; NOTES.md 2026-11-16 night, fdtget on the probe DTBs: oneplus,instantnoodlep qcom,sm8250)
COMPATIBLE="oneplus,instantnoodlep"
# [V] upstream naming omamobile-device-<codename> (upstream docs/RELEASES.md §3.1); installed on the phone 0.0.3 through 0.0.6 (NOTES.md 2026-11-17 night; docs/agents/state.md)
PACKAGE=omamobile-device-instantnoodlep
# [V] GPU-USERSPACE-PLAN.md §2 puts the vulkan-freedreno split package in this descriptor, not the shared rootfs list; DEVICE-PACKAGE-PLAN.md package-contents table. [I] the upstream Mesa split (freedreno in gallium-drivers plus vulkan-freedreno) is a pending upstream PR; on the phone today the freedreno Mesa 26.2.4 came from inumineq/gpu-mesa-freedreno via pacman -U (NOTES.md 2026-11-17 day)
ROOTFS_PACKAGES="vulkan-freedreno"
# [V] file beside the descriptor; upstream key (upstream docs/RELEASES.md:167; FIRMWARE-PLAN.md F6). [I] the map uses an image: prefix; upstream format is source-in-vendor|destination and needs the extractor change (DEVICE-PACKAGE-PLAN.md firmware-map section)
FIRMWARE_MAP=firmware.map

# --- Kernel and device tree ---
# [V] built by the K2 and later trees (NOTES.md 2026-11-16 night: dtbs_check head log builds qcom/sm8250-oneplus-instantnoodlep.dtb; tools/build-instantnoodlep-probe --dtb arch/arm64/boot/dts/qcom/sm8250-oneplus-instantnoodlep.dtb)
DTB=qcom/sm8250-oneplus-instantnoodlep.dtb
# Empty until bring-up overlays exist; proven nodes move into the DTS
# itself and leave this list (upstream CONTRIBUTING 6.1).
# [V] no overlays/ directory exists under device/instantnoodlep (dtbo/ holds stock research only)
DTB_OVERLAYS=""
# [V] N/A: /soc_id DTB selection is a Pixel ABL rule; this ABL picks the base DTB by qcom,msm-id plus oplus,dtsi_no (docs/research/r4-stock-images.md §3; NOTES.md 2026-11-16 D5: msm-id <0x164 0x20001>, oplus,dtsi_no 0x4d63)
#SOC_IDS=

# --- Bootloader glue ---
# ABL applies stock dtbo entry 16 on this unit [V: ro.boot.dtbo_idx=16 (issue #3 A3); androidboot.dtbo_idx=16 (NOTES.md 2026-11-16 R2); r4 §4: entry 16 kona MTP 19811, qcom,board-id <0x10008 0>, oplus,dtsi_no 0x4d63]. All 19 stock table entries have id/rev/custom 0 [V: r4 §4], so upstream DTBO_BOARD_ID/REV table matching does not map onto this ABL, and the neutral dtbo_b (device/instantnoodlep/dtbo/neutral.dts) was rejected by ABL twice [V: NOTES.md 2026-11-17 day; DTBO-PLAN §6].
# [I] resolved by an ABL-accepted board dtbo source (DTBO-PLAN §6, parked)
#DTBO_SOURCE=TODO
# [I] with DTBO_SOURCE; Oplus matches inside the overlay on qcom,board-id <0x10008 0> plus oplus,dtsi_no 0x4d63, not on table id/rev [V: r4 §4]
#DTBO_BOARD_ID=TODO
# [I] with DTBO_SOURCE; entry 16 carries rev 0 in qcom,board-id <0x10008 0> [V: r4 §4]
#DTBO_BOARD_REV=TODO
# No vendor_boot partition exists on this phone [V: issue #3 phase B B2], so
# VENDOR_CMDLINE carries the boot-header cmdline baked by the local builder.
# earlycon stays out of the value: stock uses earlycon=msm_geni_serial,0xa90000
# [V: r4 §2 stock cmdline; uart12 at 0x00a90000 is the GENI debug UART,
# docs/research/abl-boot-flow.md:154-158], but live-DT agreement for our DTB
# is unproven [I: DTS-PORT-PLAN.md I5].
# [V] tools/build-instantnoodlep-probe ROOT_CMDLINE, the persistent slot-B image cmdline (omamobile.initramfs only on RAM probes; systemd.watchdog_sec=20 matches RuntimeWatchdogUSec=20s on the Arch boot, NOTES.md 2026-11-17 B3)
VENDOR_CMDLINE="console=tty0 panic=10 clk_ignore_unused pd_ignore_unused printk.devkmsg=on systemd.watchdog_sec=20"
# [V] stock boot.img header page size 4096, header v2 (docs/research/r4-stock-images.md §2; STAGE-0 Q7). No vendor_boot/init_boot partitions exist [V: issue #3 B2], so this is the boot image page size
VENDOR_PAGESIZE=0x1000
# [V] stock boot.img header os_version of the verified .591 OTA (r4 §2); upstream takes OS_VERSION from the boot header on a device without init_boot (upstream docs/RELEASES.md §3.1). The Android 13 system build (ro.build.version.release=13, issue #3 A3) does not change the header value
OS_VERSION=12.0.0
# [V] stock boot.img header os patch level (r4 §2)
OS_PATCH_LEVEL=2024-06
# [V] chain case, decided in issue #10 (R4 answer): stock vbmeta of .591 has Flags 0 with boot (rollback location 4) and dtbo (location 3) as Chain Partition descriptors, so written slot-B images get upstream test-key add_hash_footer footers (docs/research/vbmeta-avb.md §4.2 option B). Sizes: boot 100663296 = 0x6000000, dtbo 25165824 = 0x1800000 [V: r4 §1 and §5; issue #10 comment]. Format image:partition_size per upstream docs/RELEASES.md §3.1 and upstream bin/omamobile:230-243. [I] whether an erased chained dtbo_b would also be valid stays open (r4 §5)
AVB_FOOTERS="boot:0x6000000 dtbo:0x1800000"
# [V] stock vbmeta rollback index 0 and stock boot footer rollback index 0 (issue #10 comment; r4 §5); never above stock (upstream docs/RELEASES.md §3.1)
AVB_ROLLBACK_INDEX=0
# [V] stock boot footer security_patch (issue #10 comment; r4 §5 props)
AVB_SECURITY_PATCH=2024-06-05

# --- Storage guard ---
# [V: STORAGE-M2-PLAN.md §1.3 and §3] Only boot and dtbo are boot images; only
# their slot-B partitions and userdata may ever be writable. Never super,
# never any _a partition, never vbmeta (AGENTS.md rule 3; upstream
# UFS_RW_ALLOWED in upstream bin/omamobile:102-105; docs/research/vbmeta-avb.md
# decision input 1).
# [V] STORAGE-M2-PLAN.md §1.3/§3; DEVICE-PACKAGE-PLAN.md descriptor row; boot_b holds the daily K3 with slot B active and successful [V: NOTES.md 2026-11-17 F2/F5/F6]
BOOT_IMAGES="boot dtbo"
# [V] same sources; userdata must be on the list (AGENTS.md rule 3; upstream bin/omamobile:151); slot-B names only, no _a, no super, no vbmeta
UFS_RW="boot_b dtbo_b userdata"
# [V] boot_b and dtbo_b live on UFS LUN 4 (sde), userdata on LUN 0 (sda) (NOTES.md 2026-11-16 D5); key per upstream docs/RELEASES.md §3.1 (upstream #530) and STORAGE-M2-PLAN.md open item I2
UFS_RW_LUNS=sde
# [I] values are known, sde boot_b 1 3 655356 655359 [V: BRINGUP-M1b-PLAN.md §2; used by tools/instantnoodlep-slot-b-mark in NOTES.md 2026-11-17 B5], but upstream sets SLOT_B_MARK only once the device has its CONTRIBUTING §3.1 entry (upstream docs/RELEASES.md §3.1; no device has one). Resolved when the Qualcomm GPT-attribute entry lands upstream (ticket #9, docs/research/gpt-exception-prep.md, blocked)
#SLOT_B_MARK=TODO

# --- Radio backup ---
# [V] all five names exist under /dev/block/by-name on this unit and every
# backup image size equals blockdev --getsize64 (NOTES.md 2026-11-16 D4;
# docs/runbooks/STAGE-0-RUNBOOK.md:532-533). No ocdt on this unit. None of
# them is on UFS_RW, as upstream requires for NV_PARTS.
# [V] NOTES.md 2026-11-16 D4; docs/runbooks/STAGE-0-RUNBOOK.md:532-533
NV_PARTS="persist modemst1 modemst2 fsg fsc"
# [I] nothing qualifies yet. devinfo is excluded: slot flags are GPT attributes on this phone, not devinfo content (docs/research/gpt-exception-prep.md:612-616; docs/drafts/device-conf-proposal.md change 2). Resolved by a partition that belongs in the way-back backup but changes on the phone
#NV_BACKUP_EXTRA=TODO

# --- Guided install ---
# [I] not yet proven from power-off on this unit. Candidates: Volume Up +
# Volume Down + Power (Lineage lineage_wiki instantnoodlep.yml download_boot;
# Nura README) versus the old draft Volume Down + Power. Observed here:
# Volume Up + Volume Down held while starting with the cable in lands in EDL
# (05c6:9008), not fastboot; fastboot was reached with Volume Up + Volume Down
# from recovery reboot [V: NOTES.md 2026-11-16 night].
# [I] resolved when the owner first enters fastboot from power-off by buttons and records the combo in NOTES.md
#INSTALL_KEYS_FASTBOOT=TODO
# [I] unverified on this unit; the old value was the Pixel phrase. Runbook rollbacks differ: hold Power about 10 s (STAGE-0-RUNBOOK B1) versus Power + Volume Up 10-30 s (BRINGUP-M1-PLAN R1). Resolved by the owner observing the force-restart combo on this unit
#INSTALL_KEYS_RESTART=TODO
# [I] the old 25 was a rough estimate. Compute from the real inputs: full OTA 4.66 GB [V: issue #3 R2 comment], MSM package size (not recorded), kernel tree, built images and the rootfs working copy. Resolved when that sum is recorded
#INSTALL_FREE_GB=TODO

# --- Initramfs ---
# Shared upstream script.
# [V] shared upstream script (upstream device/enchilada/device.conf)
INITRAMFS_INIT=/initramfs/init
# [V] stays unset: upstream forbids another phone register address, and on this phone the panel is driven by panel-samsung-ams678uw01 under msm [V: NOTES.md 2026-11-17 night, mode 1440x3168@120], while simple-framebuffer fails to enable its clock under K3 [V: NOTES.md 2026-11-17 midday]
#SIMPLEFB_TRIG_CON=
# [V] stays unset: the panel driver probe facts are collected (panel binds, NOTES.md 2026-11-17 night) and the watchdog/DPP probe is a bring-up debug aid, not needed on the daily boot_b
#BRINGUP_PROBE=
# Panel size in pixels, portrait.
# [V] live panel under K3: lock screen and Hyprland DSI-1 report 1440x3168@120 (NOTES.md 2026-11-17 day and night); the Nura image drives the same mode (NOTES.md 2026-11-15)
PANEL_SIZE=1440x3168
