# SPDX-License-Identifier: MIT
# Device descriptor draft: OnePlus 8 Pro (instantnoodlep), EU model IN2023.
#
# FORMAT: KEY=value or KEY="value" lines, comments and blank lines only.
# No shell: no $, backticks or command substitution. Mirrors the upstream
# cheetah descriptor (derekross/omarchy-mobile device/cheetah/device.conf),
# keys documented in upstream docs/RELEASES.md.
#
# DRAFT STATUS: values marked TODO or I (inference) are UNVERIFIED and must
# be confirmed by stage-0 facts (docs/STAGE-0.md) before any tool uses them.
# Do not point bin/omamobile at this file until the TODOs are resolved.

# --- Identity ---
CODENAME=instantnoodlep
NAME="OnePlus 8 Pro"
# I: only if we want a distinct USB product string.
USB_PRODUCT="OnePlus 8 Pro (Omamobile Mobile)"
SOC=sm8250
# I: verify against the root compatible in the SM8250 fork's
# sm8250-oneplus-instantnoodlep.dts; upstream style is
# "qcom,sm8250-<vendor>-<board>", "qcom,sm8250".
COMPATIBLE="qcom,sm8250-oneplus-instantnoodlep"
# I: the upstream project's package naming convention.
PACKAGE=omamobile-device-instantnoodlep
# I: none of cheetah's board packages apply; fill as subsystems come up
# (audio, sensors, modem, camera).
ROOTFS_PACKAGES=""

# --- Kernel and device tree ---
# I: path after porting the DTS into linux-omarchy-mobile's tree.
DTB=qcom/sm8250-oneplus-instantnoodlep.dtb
# Empty until bring-up overlays exist; proven nodes move into the DTS
# itself and leave this list (upstream CONTRIBUTING 6.1).
DTB_OVERLAYS=""
# N/A: /soc_id DTB selection is a Pixel ABL rule; Qualcomm's ABL does not
# select DTBs by /soc_id. Keep unset unless stage 0 shows otherwise.
#SOC_IDS=

# --- Bootloader glue ---
# I: OnePlus/Qualcomm boot flow. Stage 0 must determine: does the stock
# bootloader apply a board dtbo at all (stock dtbo.img, ro.boot.dtbo_idx)?
# If yes, ship a trivial one; if no, keep these keys unset.
#DTBO_SOURCE=instantnoodlep-overlay.dts
#DTBO_BOARD_ID=
#DTBO_BOARD_REV=
# I: kernel args on Qualcomm go via the boot image cmdline (or DT
# /chosen/bootargs as upstream prefers); earlycon UART base address must
# come from the stock device tree capture, not guessed.
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on"
# I: page size of the boot image (from stock boot.img or fastboot getvar).
#VENDOR_PAGESIZE=
# I: boot image header version (expected v3 with separate dtbo on this
# device; no init_boot/vendor_boot/vendor_kernel_boot, which are Pixel-era
# Android 13 partitions). fastboot getvar all decides.
OS_VERSION=13.0.0
OS_PATCH_LEVEL=2024-04
# I: OnePlus vbmeta handling differs from Pixel (no chained AVB footers the
# same way; unlock is via fastboot oem unlock). Verify what stock's
# vbmeta_b chains before deciding whether AVB keys are needed at all.
#AVB_FOOTERS=
#AVB_ROLLBACK_INDEX=
#AVB_SECURITY_PATCH=

# --- Storage guard ---
# I: expected boot images on this device: boot, dtbo, vbmeta (maybe
# vbmeta_system). Verify against the by-name listing from stage 0 and
# fastboot getvar all. Only slot B images may ever be listed here.
BOOT_IMAGES="boot dtbo vbmeta"
UFS_RW="boot_b dtbo_b vbmeta_b userdata"

# --- Radio backup ---
# I: Qualcomm EFS/NV equivalents of cheetah's radio partitions; verify
# against the by-name listing (candidates: persist modemst1 modemst2 fsc
# fsg, plus efs-like partitions if present). devinfo holds the slot flags.
NV_PARTS="persist modemst1 modemst2 fsc fsg"
NV_BACKUP_EXTRA="devinfo"

# --- Guided install ---
# I: verify key combo from stock behaviour; OnePlus 8 series reaches
# fastboot with the phone off by holding Volume Down + Power.
INSTALL_KEYS_FASTBOOT="with the phone off, hold Volume Down, then also hold Power, until the fastboot screen appears"
INSTALL_KEYS_RESTART="hold Power for about 30 seconds, then press it again"
# I: rough estimate; count kernel tree, factory OTA, images and rootfs.
INSTALL_FREE_GB=25

# --- Initramfs ---
# Shared upstream script.
INITRAMFS_INIT=/initramfs/init
# WARNING (upstream rule): never put another phone's display register
# address in this key. Leave unset until this phone's panel is driven.
#SIMPLEFB_TRIG_CON=
# Leave unset until the panel driver probe facts are collected.
#BRINGUP_PROBE=
# Panel size in pixels, portrait.
PANEL_SIZE=1440x3168
