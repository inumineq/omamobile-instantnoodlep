# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 8 Pro (instantnoodlep), EU model IN2023.
#
# FORMAT: KEY=value or KEY="value" lines, comments and blank lines only.
# No shell: no $, backticks or command substitution. Mirrors the upstream
# cheetah descriptor (derekross/omarchy-mobile device/cheetah/device.conf),
# keys documented in upstream docs/RELEASES.md.
#
# Candidate descriptor for the local port. Values still marked [I] are not
# release-qualified; this package does not make them safe to use for flashing.

# --- Identity ---
CODENAME=instantnoodlep
NAME="OnePlus 8 Pro"
USB_PRODUCT="OnePlus 8 Pro (Omamobile Mobile)"
SOC=sm8250
COMPATIBLE="qcom,sm8250-oneplus-instantnoodlep"
PACKAGE=omamobile-device-instantnoodlep
ROOTFS_PACKAGES="vulkan-freedreno"
FIRMWARE_MAP=firmware.map

# --- Kernel and device tree ---
DTB=qcom/sm8250-oneplus-instantnoodlep.dtb
# Empty until bring-up overlays exist; proven nodes move into the DTS
# itself and leave this list (upstream CONTRIBUTING 6.1).
DTB_OVERLAYS=""
# N/A: /soc_id DTB selection is a Pixel ABL rule; Qualcomm's ABL does not
# select DTBs by /soc_id. Keep unset unless stage 0 shows otherwise.
#SOC_IDS=

# --- Bootloader glue ---
# [I] Stock bootloader DTBO behavior and board IDs remain unverified.
#DTBO_SOURCE=instantnoodlep-overlay.dts
#DTBO_BOARD_ID=
#DTBO_BOARD_REV=
# [I] Kernel command line is a local K3 value; earlycon remains unset.
VENDOR_CMDLINE="console=tty0 clk_ignore_unused pd_ignore_unused printk.devkmsg=on"
#VENDOR_PAGESIZE=
# [I] OS image metadata is provisional; confirm against owner's verified OTA.
OS_VERSION=13.0.0
OS_PATCH_LEVEL=2024-04
# [I] AVB layout/handling remains unresolved. vbmeta is never writable via
# this descriptor or the port's storage guard.
#AVB_FOOTERS=
#AVB_ROLLBACK_INDEX=
#AVB_SECURITY_PATCH=

# --- Storage guard ---
# [V: STORAGE-M2-PLAN §1, §3] Only boot and dtbo are boot images; only their
# slot-B partitions and userdata may ever be writable. Never super or _a.
BOOT_IMAGES="boot dtbo"
UFS_RW="boot_b dtbo_b userdata"

# --- Radio backup ---
# [I] No NV partition names are configured until the protected-partition
# inventory and backup plan are reviewed. Never write these partitions.

# --- Guided install ---
# [I] Verify recovery key combinations on-device before publishing guidance.
INSTALL_KEYS_FASTBOOT="with the phone off, hold Volume Down, then also hold Power, until the fastboot screen appears"
INSTALL_KEYS_RESTART="hold Power for about 30 seconds, then press it again"
INSTALL_FREE_GB=25

# --- Initramfs ---
# Shared upstream script.
INITRAMFS_INIT=/initramfs/init
# WARNING (upstream rule): never put another phone's display register
# address in this key. Leave unset until this phone's panel is driven.
#SIMPLEFB_TRIG_CON=
# Leave unset until the panel driver probe facts are collected.
#BRINGUP_PROBE=
# Panel size in pixels, portrait.
PANEL_SIZE=1440x3168
