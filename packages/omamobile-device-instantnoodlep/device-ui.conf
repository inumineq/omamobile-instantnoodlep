# Installed as /usr/share/omamobile/device-ui.conf by this package.
# Values are physical output pixels; SafeInsets converts them to logical units.
# [V] Edge calibration 2026-11-18 (tools/instantnoodlep-edge-calibrate, touch
# range 0..1439): repeated taps on the curved edges landed at x=19..79 (left)
# and x=1365..1413 (right). Nothing below x=19 or above x=1413 registers, so
# content keeps clear of that dead band plus a few pixels.
safe_insets_px=24,0,30,0
# The back strip starts at the screen edge (OMAMOBILE_BACK_EDGE_INSET=0) and
# must cover where thumbs land: 0..96 px holds both observed bands (19..79 and
# 1439-1413=26..74 from the right).
gesture_edge_width_px=96
