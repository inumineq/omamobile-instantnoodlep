# Candidate per-device Chromium profile. All device-specific values are [I]
# until the attended morning survey records results. Set a feature to auto to
# leave Chromium's build default in control; set ozone_platform=wayland only
# when the runtime survey shows it did not select Wayland automatically.
scale_factor=0.83
android_version=13
device_model=OnePlus 8 Pro
wayland_ime=enabled
text_input_version=3
overlay_scrollbars=auto
touch_events=auto
pinch_zoom=auto
ozone_platform=auto
