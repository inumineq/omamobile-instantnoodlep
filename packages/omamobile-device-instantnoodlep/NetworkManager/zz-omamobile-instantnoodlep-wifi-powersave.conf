# Turn Wi-Fi power save on (3 = enable). Omarchy's own
# omarchy-wifi-powersave.conf turns it off (2), which is right for a laptop
# on mains. On this phone that costs about 80 mA with the screen off, measured
# with the cable out. NetworkManager lets files that sort later win, so the
# name starts with zz. It has to live in /etc: files there shadow
# /usr/lib/NetworkManager/conf.d, where a package would normally put it.
[connection-omamobile-instantnoodlep-wifi-powersave]
match-device=type:wifi
wifi.powersave=3
