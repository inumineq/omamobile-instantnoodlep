# Account baseline for omamobile-device-instantnoodlep (issue #189).
# sysusers.d format: "type name id gecos home shell" (sysusers.d(5)).
#
# camera — dedicated group for the camera device class (/dev/media*,
# /dev/video*). The camera rule (one rule file of its own when it lands)
# sets GROUP="camera", MODE="0660" and TAG+="uaccess". A dedicated group
# rather than root or the shared "video" group keeps camera access
# separable from display/GPU access and auditable per device class.
# The group is created here so that it exists before the first rule
# naming it ships; test/udev fails on any GROUP= that is neither declared
# here nor provided by base Arch.
g camera - - - -
#
# The session user is deliberately not a line in this file.
# omamobile-firstboot creates it with an owner-chosen name at first boot
# [V: upstream omarchy-mobile @ 8991845,
# packages/omamobile-firstboot/bin/omamobile-firstboot:295
# "useradd -m -G wheel,audio,video,input ... \"$U\""], so no static
# sysusers.d entry can name it: an "m" line would implicitly create a
# second, disabled system user of a guessed name (sysusers.d(5), type "m").
# The session user instead reaches the camera group through the
# "uaccess" tag on the rule (the active seat-0 user gets an ACL at
# runtime), and on a phone that already ran firstboot the owner adds the
# login user by hand — gated runbook in udev/README.md.
